# ═══════════════════════════════════════════════════════════════════════
#  amp.sh — settings
#
#  Just edit the values below. Lines starting with # are ignored.
#  This is the only config file. Edit it directly.
# ═══════════════════════════════════════════════════════════════════════


# ─── VM resources ──────────────────────────────────────────────────────
# Raise MEMORY if the platform feels slow. Takes effect on the next
# ./amp.sh nuke && ./amp.sh up  (a running VM keeps the size it was built with).

CPU=4
MEMORY=8
DISK=60


# ─── Where the VM lives ────────────────────────────────────────────────
# All Colima and Lima state goes here: the VM, the data disk holding
# /var/lib/docker, the config and the SSH keys. Nothing lands in ~/.colima.
# A relative path is resolved from this file's directory.

STATE_DIR=.colima


# ─── Names ─────────────────────────────────────────────────────────────
# KEEP THE PROFILE SHORT. macOS caps a Unix socket path at 104 characters
# and ssh adds a 17-character suffix, so the real rule is:
#
#     length(STATE_DIR path) + length(PROFILE) + 40  <=  104
#
# Go over it and the VM boots for ten minutes before dying. amp.sh checks
# this before every start and tells you by how much you are over.

PROFILE=amp


# ─── Platform ──────────────────────────────────────────────────────────
# Latest release c: ghcr.io/wso2/amp-quick-start:v1.0.0-rc3
IMAGE=ghcr.io/wso2/amp-quick-start:v1.0.0-rc2
CONSOLE_URL=http://console.amp.localhost:8080


# ─── Optional ──────────────────────────────────────────────────────────
# Uncomment to change. Also relative to this file's directory.

#BACKUP_DIR=.colima_backups

# YES=1        never ask for confirmation
# WAIT_PODS=0  do not wait for pods to settle after a start

#YES=1
#WAIT_PODS=0
